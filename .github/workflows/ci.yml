name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-gateway-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.5.0
        with:
          go-version: "1.23"
          cache: true
      - name: Format and dependency lock
        shell: bash
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Static checks and unit tests
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Compose integration contract
        shell: bash
        env:
          RATE_LIMIT: "0.01"
          RATE_BURST: "2"
        run: |
          docker compose up --build --wait redis upstream otel-collector gateway
          docker build --target build -t api-gateway-lite-test-ci .
          docker run --rm --network api-gateway-lite_default -e TEST_REDIS_ADDR=redis:6379 api-gateway-lite-test-ci go test -count=1 ./internal/ratelimit -run RedisLimiter
          headers=$(mktemp)
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:8080/echo)" = "401"
          curl -fsS -D "$headers" -H 'X-API-Key: local-demo-key' -H 'X-Correlation-ID: ci-correlation' http://localhost:8080/echo | grep -qx 'ok'
          grep -qi '^X-Correlation-ID: ci-correlation' "$headers"
          grep -qi '^X-Received-Correlation-ID: ci-correlation' "$headers"
          grep -qi '^X-Received-Traceparent: 00-' "$headers"
          curl -fsS -o /dev/null -H 'X-API-Key: local-demo-key' http://localhost:8080/echo
          test "$(curl -sS -o /dev/null -w '%{http_code}' -H 'X-API-Key: local-demo-key' http://localhost:8080/echo)" = "429"
      - name: Stop integration stack
        if: always()
        run: docker compose --profile benchmark down --volumes --remove-orphans
      - name: Reproduce benchmark V2
        shell: bash
        env:
          BENCHMARK_PRODUCER: github-actions
          BENCHMARK_HARDWARE_CLASS: github-hosted-ubuntu
          CI_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_RESULTS_DIR: ${{ runner.temp }}/api-gateway-lite
        run: sh ./tools/run-benchmark.sh
      - name: Validate benchmark and project
        shell: pwsh
        run: ./tools/validate-project.ps1 -SkipDocker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-v2-${{ github.sha }}
          path: ${{ runner.temp }}/api-gateway-lite/latest.json
          if-no-files-found: error
          retention-days: 14
