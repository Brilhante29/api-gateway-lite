id: 18
name: api-gateway-lite
program:
  id: delivery-observability-infra
  narrative_fit: This repository proves a reusable ingress boundary with measurable overhead, shared quotas, and vendor-neutral trace export for the delivery and observability portfolio.
  shared_assets:
    - atomic Redis token-bucket contract
    - benchmark evidence V2 pattern
    - OTLP local-first runtime
status: implemented
claim: A small Go gateway can enforce authentication and a shared atomic quota while propagating correlation and trace context with measured overhead.
stack:
  - go-1.23
  - net-http-reverse-proxy
  - redis-7.4
  - opentelemetry-otlp-http
  - otel-collector
  - docker-compose
language_profile:
  primary: go-backend
  secondary: []
  reason: Go net/http exposes the proxy and middleware costs directly while preserving standard HTTP interoperability and low operational weight.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
  agent_graph:
    mode: sequential-subagent-roles
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: The gateway composition depends on small Limiter and HealthChecker capabilities; Redis and OTLP remain replaceable infrastructure details.
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: One Go binary and standard HTTP middleware are used; Redis exists only because cross-instance atomic quota is part of the proof.
    testability_rule: HTTP behavior runs under httptest, Redis behavior has a real shared-instance contract, and OTLP export is verified against an HTTP collector stub.
    rejected_overengineering:
      - dynamic route administration
      - service discovery
      - retries and circuit breaking
      - a message broker
  stack_profile: go-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: not-applicable; Kumo is reserved for projects that prove AWS semantics
    real_provider_target: any OTLP-compatible observability backend
    emulated_services: []
    adapter_rule: OTLP endpoint selection is configuration-only and no vendor SDK enters request policy or proxy code.
    config_switch: TELEMETRY=otlp|none
    unsupported_behaviors:
      - vendor-specific authentication
      - managed gateway control planes
  database: Redis is an operational quota store, not a system-of-record database
  runtime: Go 1.23 on Alpine 3.21
  library_policy: Use Go stdlib for HTTP and reverse proxying, go-redis for the atomic Redis adapter, and official OpenTelemetry packages for trace instrumentation and export.
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: Gin or Fiber
      reason: The gateway needs standard net/http middleware and transparent overhead, not framework routing features.
    - option: in-memory rate limiter
      reason: It cannot enforce one quota across replicas and would invalidate the reliability claim.
    - option: vendor observability SDK
      reason: OTLP keeps the exporter replaceable and the default runtime credential-free.
architecture:
  style: modular-monolith
  reason: Authentication, quota, telemetry, and proxying share one request lifecycle and deployment unit while remaining isolated as composable modules.
  problem_forces:
    domain_complexity: low
    integration_pressure: high
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: medium
    throughput_or_async: high
    independent_deployability: low
  dependency_rule: Startup composes concrete adapters; request policy depends only on narrow interfaces and net/http contracts.
  boundaries:
    - internal/auth owns credential verification and principal creation
    - internal/ratelimit owns quota policy plus the Redis adapter
    - internal/telemetry owns correlation and OpenTelemetry integration
    - internal/proxy owns upstream forwarding
    - internal/benchmark owns evidence generation
  rejected_alternatives:
    - style: microservices
      reason: Splitting one synchronous request path creates network and deployment costs without independent business capabilities.
    - style: clean-architecture
      reason: Full use-case and entity rings add ceremony to a policy pipeline with no independent domain model.
design_system:
  tokens: .portfolio/design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local-snapshot
  uses:
    - default-portfolio-project
    - go-backend-language-profile
    - benchmark-result-v2
    - engineering-principles
    - reuse-improvement-loop
benchmark:
  primary_metric: overhead_p95_ms
  unit: ms
  command: pwsh ./tools/run-benchmark.ps1
  result_path: benchmarks/results/latest.json
release:
  docker: compose-runtime-and-benchmark-implemented
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
