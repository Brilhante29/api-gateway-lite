id: 18
name: api-gateway-lite
program:
  id: delivery-observability-infra
  narrative_fit: This gateway demonstrates how to add auth, rate limiting, and distributed tracing in front of any upstream service â€” a foundational pattern for observability infrastructure.
  shared_assets:
    - ratelimit/token-bucket pattern
status: published
claim: gateway com auth, rate limit e observabilidade
stack:
  - go
  - reverse-proxy
  - redis
  - opentelemetry
  - k6
  - docker
language_profile:
  primary: go-backend
  secondary: []
  reason: Go is the standard for high-throughput reverse proxies and middleware pipelines; stdlib httputil.ReverseProxy eliminates framework overhead for benchmark purity.
decision_brain:
  agentic_spec:
    source: .portfolio/decision-brain/agentic-spec-governance.yaml
    spec_store: portfolio-reuse-kit
    schema: portfolio-system
    project_config: openspec/config.yaml
    component_pack: default-portfolio-project
    artifact_graph:
      - intent->portfolio-impact->architecture-record
      - architecture-record+portfolio-impact->component-pack
      - component-pack->reuse-delta->benchmark-proof->tasks->verification
  agent_graph:
    mode: principal-agent-orchestrated
    source: .portfolio/decision-brain/agent-graph.yaml
    handoff: sdd/agent-handoff.md
    local_first_runtime: docker+kumo-when-cloud-behavior-is-needed
  reuse_improvement_loop:
    source: .portfolio/decision-brain/reuse-improvement-loop.yaml
    review_path: sdd/reuse-improvement-review.md
    current_status: completed
  principles:
    coupling_rule: domain/use cases do not depend on framework, database, broker, cloud SDK, transport, or UI
    solid: [srp, ocp, lsp, isp, dip]
    simplicity_rule: in-memory token bucket over Redis avoids unnecessary network dependency for local path
    testability_rule: all middleware tested via httptest without real servers
    rejected_overengineering:
      - Redis-backed rate limiter (overkill for single-instance gateway)
      - OTLP exporter with collector (stdout exporter sufficient for local demo)
      - Circuit breaker (YAGNI for current scope)
  stack_profile: go-backend
  api_style: rest-http
  messaging: none
  cloud:
    mode: none
    local_provider: kumo
    real_provider_target: none
    emulated_services: []
    adapter_rule: ports/adapters keep cloud SDK outside domain/use cases
    config_switch: CLOUD_PROVIDER=none
    unsupported_behaviors: []
  database: none
  runtime: go 1.22, alpine 3.20
  library_policy: stdlib net/http/httputil for proxy, otel SDK for tracing, in-memory token bucket for rate limiting
  record_path: sdd/technical-decision.md
  rejected_options:
    - option: gin-gonic/gin framework
      reason: stdlib is lighter for benchmark purity; gin adds measurable overhead
    - option: Redis-backed rate limiter
      reason: unnecessary network hop for local demo; YAGNI for single-instance
    - option: OTLP gRPC exporter
      reason: stdout exporter is simpler for local demo; gRPC adds dependency weight
architecture:
  style: modular-monolith
  reason: The gateway is a single binary with composable middleware layers (auth, rate limit, tracing) wrapping a reverse proxy. This avoids microservice complexity while keeping each concern independently testable and swappable.
  problem_forces:
    domain_complexity: low
    integration_pressure: low
    ui_state_complexity: none
    data_or_ml_reproducibility: low
    auditability: low
    throughput_or_async: medium
    independent_deployability: low
  dependency_rule: middleware depends on the handler interface only; config is parsed at startup and injected
  boundaries:
    - internal/config: startup configuration
    - internal/proxy: upstream forwarding
    - internal/auth: API key validation
    - internal/ratelimit: token bucket + HTTP middleware
    - internal/telemetry: tracing setup + HTTP middleware
    - internal/benchmark: overhead measurement harness
  rejected_alternatives:
    - style: microservices
      reason: adds deployment and coordination complexity without benefit for a single-process gateway
    - style: hexagonal architecture
      reason: ports/adapters abstraction adds indirection that inflates overhead_ms benchmark
design_system:
  tokens: design-system/tokens.yaml
  readme_components:
    - readme_header
    - benchmark_card
    - architecture_card
    - references_table
  diagram_required: true
reuse:
  kit_version: local
  uses:
    - catalog
    - programs
    - proficiency-map
    - component-packs
    - openspec-schema
    - decision-brain
    - agent-graph
    - reuse-improvement-loop
    - architecture
    - language-profiles
    - design-system
    - sdd
    - harness
    - templates
    - skills
benchmark:
  primary_metric: overhead_ms
  unit: unit
  command: go run ./cmd/benchmark
  result_path: benchmarks/results/*.json
release:
  docker: implemented
  no_secret_default_path: true
  readme_has_number: true
  references_documented: true
